<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Wallet Tracker Pro</title>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>
        body { background:#fff1f2; font-family:sans-serif; margin:0; padding-bottom:90px; color:#334155; }
        .header { background:linear-gradient(135deg,#db2777,#7c3aed); color:white; padding:15px; text-align:center; }
        .container { max-width:450px; margin:0 auto; padding:15px; }
        .card-row { display:flex; gap:10px; margin-bottom:15px; }
        .card-green { background:linear-gradient(135deg,#059669,#0d9488); color:white; padding:15px; border-radius:16px; flex:1; }
        .card-orange { background:linear-gradient(135deg,#d97706,#ea580c); color:white; padding:15px; border-radius:16px; flex:1; }
        .section-title { font-size:14px; font-weight:bold; text-transform:uppercase; margin:15px 0 8px 0; display:flex; justify-content:space-between; }
        .box-white { background:white; padding:15px; border-radius:16px; border:1px solid #fce7f3; margin-bottom:15px; }
        .wallet-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .modal { position:fixed; inset:0; background:rgba(0,0,0,0.5); display:none; align-items:center; justify-content:center; z-index:100; }
        .modal-content { background:white; padding:20px; border-radius:16px; width:280px; margin:auto; border:1px solid #cbd5e1; }
        .bottom-nav { position:fixed; bottom:0; left:0; right:0; background:white; border-top:1px solid #e2e8f0; padding:12px; display:flex; justify-content:space-around; font-weight:bold; }
    </style>
</head>
<body>
    <div class="header">
        <div style="max-width:450px; margin:0 auto; display:flex; justify-content:space-between; align-items:center;">
            <div><b>💰 E-WALLET TRACKER</b><br><span style="font-size:9px; color:#4ade80;">● Live Cloud Active</span></div>
            <div style="text-align:right;"><span style="font-size:9px; display:block;">Total Capital</span><span id="total-balance" style="font-size:18px; font-weight:900; color:#fde047;">₱0.00</span></div>
        </div>
    </div>
    <div class="container">
        <div class="card-row">
            <div class="card-green"><span>CASH BALANCE</span><br><b>₱<span id="cash-balance">0.00</span></b></div>
            <div class="card-orange"><span>TOTAL PROFIT</span><br><b>₱<span id="total-profit">0.00</span></b></div>
        </div>
        <div>
            <div class="section-title"><span>My E-Wallets</span><button onclick="openW()" style="color:#db2777; background:none; border:none; font-weight:bold;">+ Add Wallet</button></div>
            <div class="wallet-grid" id="wallets-container"></div>
        </div>
        <div class="section-title">Transaction History</div>
        <div class="box-white" id="tx-list" style="font-size:12px; max-height:120px; overflow-y:auto;">No logs.</div>
        <div class="section-title">Quick Notes <span id="record-count" style="color:#db2777;">0 records</span></div>
        <div class="box-white"><input type="text" id="new-note-input" placeholder="Add note..." style="width:65%; padding:6px;"><button onclick="addN()" style="background:#db2777; color:white; border:none; padding:6px 12px; margin-left:5px;">Add</button><div id="notes-list" style="margin-top:10px; font-size:12px;"></div></div>
    </div>
    <div id="w-modal" class="modal"><div class="modal-content"><b>➕ New Wallet</b><br><input type="text" id="w-name" placeholder="Name" style="width:95%; margin-top:10px;"><br><input type="number" id="w-bal" placeholder="Balance" style="width:95%; margin-top:10px;"><br><br><button onclick="closeW()">Cancel</button><button onclick="saveW()" style="background:#db2777; color:white; margin-left:10px;">Save</button></div></div>
    <div id="tx-modal" class="modal"><div class="modal-content"><b id="tx-title">Transaction</b><br><select id="tx-select" style="width:95%; margin-top:10px;"></select><br><input type="number" id="tx-amt" placeholder="Amount" style="width:95%; margin-top:10px;"><br><input type="number" id="tx-fee" placeholder="Fee / Profit" style="width:95%; margin-top:10px;"><br><br><button onclick="closeTx()">Cancel</button><button onclick="saveTx()" style="background:#059669; color:white; margin-left:10px;">Submit</button></div></div>
    <div class="bottom-nav"><button onclick="openTx('In')" style="color:#16a34a; background:none; border:none;">📥 Cash In</button><button onclick="openW()" style="background:#db2777; color:white; border-radius:50%; width:35px; height:35px;">＋</button><button onclick="openTx('Out')" style="color:#dc2626; background:none; border:none;">📤 Cash Out</button></div>
    <script>
        firebase.initializeApp({ databaseURL: "https://firebasedatabase.app" });
        const db = firebase.database(); let wallets = {}, txType = "In";
        function addN() { const t = document.getElementById('new-note-input').value.trim(); if(t) db.ref('notes').push({text:t}).then(()=>{document.getElementById('new-note-input').value=""}); }
        db.ref('notes').on('value', s => { const c = document.getElementById('notes-list'); c.innerHTML = ""; let n = 0; if(s.exists()) { Object.keys(s.val()).forEach(k => { n++; const d = document.createElement('div'); d.innerHTML = `<span>${s.val()[k].text}</span><button onclick="db.ref('notes/'+'${k}').remove()">🗑️</button>`; c.appendChild(d); }); } document.getElementById('record-count').innerText = n + ' records'; });
        function openW() { document.getElementById('w-modal').style.display = "flex"; }
        function closeW() { document.getElementById('w-modal').style.display = "none"; document.getElementById('w-name').value=""; document.getElementById('w-bal').value=""; }
        function saveW() { const n = document.getElementById('w-name').value.trim(), b = parseFloat(document.getElementById('w-bal').value)||0; if(n) db.ref('wallets').push({name:n, balance:b}).then(closeW); }
        db.ref('wallets').on('value', s => { const c = document.getElementById('wallets-container'), sel = document.getElementById('tx-select'); c.innerHTML = ""; sel.innerHTML = ""; let t = 0; if(s.exists()) { wallets = s.val(); Object.keys(wallets).forEach(k => { const w = wallets[k]; t += w.balance; const d = document.createElement('div'); d.style.background="white"; d.style.padding="10px"; d.style.border="1px solid #fce7f3"; d.innerHTML = `<b>${w.name}</b><br><span style="color:#db2777;">₱${w.balance}</span><button onclick="if(confirm('Delete?'))db.ref('wallets/'+'${k}').remove()">🗑️</button>`; c.appendChild(d); const o = document.createElement('option'); o.value = k; o.innerText = w.name; sel.appendChild(o); }); } document.getElementById('total-balance').innerText = '₱' + t; });
        function openTx(type) { txType = type; document.getElementById('tx-title').innerText = "Cash " + type; document.getElementById('tx-modal').style.display = "flex"; }
        function closeTx() { document.getElementById('tx-modal').style.display = "none"; document.getElementById('tx-amt').value=""; document.getElementById('tx-fee').value=""; }
        function saveTx() { const k = document.getElementById('tx-select').value, a = parseFloat(document.getElementById('tx-amt').value)||0, f = parseFloat(document.getElementById('tx-fee').value)||0; if(!k || a<=0) return alert("Error"); let nb = wallets[k].balance; if(txType==="In") nb += a; else { if(a>nb) return alert("Kulang laman"); nb -= a; } db.ref('transactions').push({wName:wallets[k].name, type:txType, amt:a, fee:f}).then(() => { db.ref('wallets/'+k).update({balance:nb}); closeTx(); }); }
        db.ref('transactions').on('value', s => { const c = document.getElementById('tx-list'); c.innerHTML = ""; let p = 0; if(s.exists()) { Object.keys(s.val()).reverse().forEach(k => { const t = s.val()[k]; p += t.fee; const d = document.createElement('div'); d.innerHTML = `<span>${t.type} (${t.wName})</span>: <b>₱${t.amt} (+₱${t.fee})</b>`; c.appendChild(d); }); } document.getElementById('total-profit').innerText = p; });
    </script>
</body>
</html>
