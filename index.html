<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Wallet Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; background-color: #f4f6f8; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
    h2, h3 { margin-top: 0; color: #333; }
    .balance { font-size: 28px; font-weight: bold; color: #2e7d32; }
    input, select, button { width: 100%; padding: 10px; margin: 6px 0; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-size: 14px; }
    button { background-color: #007bff; color: white; font-weight: bold; border: none; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    .transaction-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
    .income { color: #2e7d32; font-weight: bold; }
    .expense { color: #c62828; font-weight: bold; }
    .btn-group { display: flex; gap: 5px; margin-top: 5px; }
    .btn-sm { padding: 4px 8px; font-size: 12px; width: auto; }
    .btn-edit { background-color: #ff9800; color: white; }
    .btn-delete { background-color: #f44336; color: white; }
  </style>
</head>
<body>

  <div class="card">
    <h2>E-Wallet Tracker</h2>
    <div>Total Balance:</div>
    <div class="balance" id="totalBalance">₱0.00</div>
  </div>

  <div class="card">
    <h3 id="formTitle">Add Transaction</h3>
    <input type="hidden" id="editDocId" />
    <input type="text" id="note" placeholder="Description (e.g. Baon, Jollibee, GCash Cash In)" />
    <input type="number" step="any" id="amount" placeholder="Amount (₱)" />
    <select id="type">
      <option value="income">Income (+)</option>
      <option value="expense">Expense (-)</option>
    </select>
    <button id="saveBtn" onclick="saveTransaction()">Save Transaction</button>
  </div>

  <div class="card">
    <h3>Transaction History</h3>
    <div id="transactionList">Loading transactions...</div>
  </div>

  <!-- Firebase Modular SDK Setup -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      doc, 
      onSnapshot, 
      query, 
      orderBy, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. Ang iyong Firebase Credentials
    const firebaseConfig = {
      apiKey: "AIzaSyDWnLjULj9iaeyd3gu4ohlLvvYdW4hoE18",
      authDomain: "e-wallet-aaecb.firebaseapp.com",
      projectId: "e-wallet-aaecb",
      storageBucket: "e-wallet-aaecb.firebasestorage.app",
      messagingSenderId: "166256897604",
      appId: "1:166256897604:web:cb4072b94347a1e174d611",
      measurementId: "G-H78QYVB5XJ"
    };

    // 2. Initialize Firebase & Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 3. REAL-TIME LISTENER (Kusa at matik na nag-uupdate kapag may nabago)
    const q = query(collection(db, "transactions"), orderBy("createdAt", "desc"));
    
    onSnapshot(q, (snapshot) => {
      let transactions = [];
      let total = 0;

      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const item = { id: docSnap.id, ...data };
        transactions.push(item);

        // Kwenta ng Total Balance
        if (data.type === 'income') {
          total += Number(data.amount || 0);
        } else {
          total -= Number(data.amount || 0);
        }
      });

      // Update Total Balance sa screen
      document.getElementById("totalBalance").innerText = `₱${total.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

      // Update Listahan sa screen
      renderList(transactions);
    }, (error) => {
      console.error("Error fetching transactions: ", error);
      document.getElementById("transactionList").innerHTML = "<p style='color:red;'>Failed to load transactions. Check console/rules.</p>";
    });

    // 4. Render Transaction List
    function renderList(list) {
      const container = document.getElementById("transactionList");
      if (list.length === 0) {
        container.innerHTML = "<p>No transactions logged yet.</p>";
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="transaction-item">
          <div>
            <strong>${item.note || 'No Description'}</strong><br/>
            <small style="color: #666;">${item.type ? item.type.toUpperCase() : ''}</small>
          </div>
          <div style="text-align: right;">
            <span class="${item.type}">
              ${item.type === 'income' ? '+' : '-'}₱${Number(item.amount || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}
            </span>
            <div class="btn-group">
              <button class="btn-sm btn-edit" onclick="prepareEdit('${item.id}', '${(item.note || '').replace(/'/g, "\\'")}', ${item.amount}, '${item.type}')">Edit</button>
              <button class="btn-sm btn-delete" onclick="deleteTransaction('${item.id}')">Delete</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // 5. ADD & EDIT Function
    window.saveTransaction = async function() {
      const editId = document.getElementById("editDocId").value;
      const note = document.getElementById("note").value;
      const amount = document.getElementById("amount").value;
      const type = document.getElementById("type").value;

      if (!amount || Number(amount) <= 0) {
        alert("Pakilagay ang tamang halaga/amount.");
        return;
      }

      try {
        if (editId) {
          // Kapag nag-e-edit
          const docRef = doc(db, "transactions", editId);
          await updateDoc(docRef, {
            note: note,
            amount: Number(amount),
            type: type,
            updatedAt: serverTimestamp()
          });
          document.getElementById("editDocId").value = "";
          document.getElementById("formTitle").innerText = "Add Transaction";
          document.getElementById("saveBtn").innerText = "Save Transaction";
        } else {
          // Kapag Bago / Add
          await addDoc(collection(db, "transactions"), {
            note: note,
            amount: Number(amount),
            type: type,
            createdAt: serverTimestamp()
          });
        }

        // Clear input fields
        document.getElementById("note").value = "";
        document.getElementById("amount").value = "";
      } catch (e) {
        alert("Error saving: " + e.message);
      }
    };

    // 6. Set Form for Edit
    window.prepareEdit = function(id, note, amount, type) {
      document.getElementById("editDocId").value = id;
      document.getElementById("note").value = note;
      document.getElementById("amount").value = amount;
      document.getElementById("type").value = type;
      
      document.getElementById("formTitle").innerText = "Edit Transaction";
      document.getElementById("saveBtn").innerText = "Update Transaction";
    };

    // 7. DELETE Function
    window.deleteTransaction = async function(id) {
      if (confirm("Sigurado ka bang gusto mong burahin ang transaction na ito?")) {
        try {
          await deleteDoc(doc(db, "transactions", id));
        } catch (e) {
          alert("Error deleting: " + e.message);
        }
      }
    };
  </script>
</body>
</html>
